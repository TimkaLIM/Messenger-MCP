name: Go CI

on: #выполняй этот скрипт каждый раз, когда происходит...
  push:
    branches: ["main"] #main это ветка
  pull_request:
    branches: ["main"]
jobs:
  build-and-test:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest #запустить это все на ubuntu
    steps:
    - name: Checkout code #-name это по сути просто имя этапа
      uses: actions/checkout@v4 #делаем копию нашего репозитория
    - name: Set up Go
      uses: actions/setup-go@v5 #Специальный скрипт, который устанавливает Go нужной версии на виртуалку
      with:
        go-version: '1.26.8'
    - name: install dependencies
      run: go mod download
    - name: Run tests with race detector
      run: go test -race ./... #означает пройти по всем папкам и запустить все тесты
    - name: Run golagnci-lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.15.0
    - name: log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-actopn@v6
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository }}:latest


